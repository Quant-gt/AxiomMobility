  /api/phase3/sustainability/ev-eligibility:
    post:
      tags: [Phase 3 intelligence]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Phase3EvEligibilityRequest'}}}

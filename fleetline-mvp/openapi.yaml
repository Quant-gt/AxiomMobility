  /api/phase3/sustainability/targets:
    get:
      tags: [Phase 3 intelligence]
      responses: {'200': {description: Sustainability targets}}
    post:
      tags: [Phase 3 intelligence]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Phase3SustainabilityTargetRequest'}}}
      responses: {'200': {description: Target created or updated with an audit reference}}
  /api/phase3/regions:
    get:
      tags: [Phase 3 intelligence]
      responses: {'200': {description: Tenant profiles plus controlled region catalog}}
    post:
      tags: [Phase 3 intelligence]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/Phase3RegionRequest'}}}
      responses: {'200': {description: Region profile activated}}
  /api/phase3/regions/{region_id}:
    patch:
      tags: [Phase 3 intelligence]
      parameters:
        - name: region_id
          in: path
          required: true
          schema: {type: string}
      responses: {'200': {description: Region profile updated}}
  /api/phase3/localization:
    get:
      tags: [Phase 3 intelligence]
      responses: {'200': {description: Effective workspace localization}}
    patch:
      tags: [Phase 3 intelligence]
      responses: {'200': {description: Default localization changed}}
  /api/phase3/fx/convert:
    post:
      tags: [Phase 3 intelligence]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/Phase3FxRequest'}}}
      responses: {'200': {description: Deterministic configured or mock FX conversion}}
  /api/phase3/tax/preview:
    post:
      tags: [Phase 3 intelligence]
      responses: {'200': {description: Regional tax preview}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: axiom_session
  parameters:
    RecordId:
      name: record_id
      in: path
      required: true
      schema: {type: string}
    DutyId:
      name: duty_id
      in: path
      required: true
      schema: {type: string}
    ServiceOrderId:
      name: service_order_id
      in: path
      required: true
      schema: {type: string}
    Kind:
      name: kind
      in: path
      required: true
      schema: {type: string, enum: [duty_types, vehicle_groups, taxes, billing_items, documents, labels, employees, passengers, feedback_forms, branches, operating_regions, suppliers, drivers, vehicles, rate_cards, sites, shifts]}
    MasterId:
      name: master_id
      in: path
      required: true
      schema: {type: string}
    RoutePlanId:
      name: route_plan_id
      in: path
      required: true
      schema: {type: string}
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema: {type: string}
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: {type: string}
    ChargingStationId:
      name: station_id
      in: path
      required: true
      schema: {type: string}
    PeriodStart:
      name: period_start
      in: query
      required: false
      schema: {type: string, format: date}
    PeriodEnd:
      name: period_end
      in: query
      required: false
      schema: {type: string, format: date}
    RegionCodeQuery:
      name: region_code
      in: query
      required: false
      schema: {type: string, enum: [IN-MH, IN-KA, AE-DU, SG-SG, GB-LND]}
    FuelTypeQuery:
      name: fuel_type
      in: query
      required: false
      schema: {type: string, enum: [petrol, diesel, cng, hybrid, ev, electric]}
    StatusQuery:
      name: status
      in: query
      required: false
      schema: {type: string}
  schemas:
    Phase3EvaluateRequest:
      type: object
      properties:
        idempotency_key: {type: string, maxLength: 160}
        model_version: {type: string, default: predictive-v1}
        stale_after_seconds: {type: integer, minimum: 60, default: 300}
        minimum_risk_score: {type: number, minimum: 0, maximum: 100}
    Phase3SimulationRequest:
      type: object
      required: [idempotency_key]
      properties:
        scenario_name: {type: string}
        idempotency_key: {type: string, maxLength: 160}
        demand_duties: {type: integer, minimum: 0}
        avg_distance_km: {type: number, minimum: 0}
        avg_duration_minutes: {type: number, minimum: 0}
        waiting_minutes: {type: number, minimum: 0}
        waiting_cost_per_minute_minor: {type: integer, minimum: 0}
        base_rate_minor: {type: integer, minimum: 0}
        fuel_cost_per_km_minor: {type: integer, minimum: 0}
        driver_cost_per_hour_minor: {type: integer, minimum: 0}
        vendor_mix:
          type: array
          items:
            type: object
            properties:
              vendor_id: {type: string}
              share: {type: number, minimum: 0}
              cost_per_duty_minor: {type: integer, minimum: 0}
        capacity_per_duty: {type: number, minimum: 1}
        capacity_required: {type: number, minimum: 1}
        service_penalty_pct: {type: number, minimum: 0}
        emissions_factor_kg_per_km: {type: number, minimum: 0}
        carbon_price_per_kg_minor: {type: integer, minimum: 0}
        region_code: {type: string, enum: [IN-MH, IN-KA, AE-DU, SG-SG, GB-LND]}
    Phase3SustainabilityRequest:
      type: object
      properties:
        duty_id: {type: string}
        duty_ids: {type: array, maxItems: 200, items: {type: string}}
        distance_km: {type: number, minimum: 0}
        passenger_count: {type: integer, minimum: 1}
        region_code: {type: string, enum: [IN-MH, IN-KA, AE-DU, SG-SG, GB-LND]}
        fuel_type: {type: string, enum: [petrol, diesel, cng, hybrid, ev, electric]}
        factor_kg_per_km: {type: number, minimum: 0}
        factor_version: {type: string}
        reserve_pct: {type: number, minimum: 0}
        deadhead_km: {type: number, minimum: 0}
        range_remaining_km: {type: number, minimum: 0}
        usable_range_km: {type: number, minimum: 0}
        energy_consumption_kwh_per_km: {type: number, minimum: 0}
        energy_price_per_kwh_minor: {type: integer, minimum: 0}
        grid_factor_kg_per_kwh: {type: number, minimum: 0}
        charging_station_id: {type: string}
        charging_connector: {type: string}
    Phase3EvEligibilityRequest:
      type: object
      required: [vehicle_id, distance_km, passenger_count]
      properties:
        vehicle_id: {type: string}
        duty_id: {type: string}
        distance_km: {type: number, minimum: 0}
        passenger_count: {type: integer, minimum: 1}
        region_code: {type: string, enum: [IN-MH, IN-KA, AE-DU, SG-SG, GB-LND]}
        reserve_pct: {type: number, minimum: 0}
        deadhead_km: {type: number, minimum: 0}
        range_remaining_km: {type: number, minimum: 0}
        usable_range_km: {type: number, minimum: 0}
        charging_connector: {type: string}
        charging_station_id: {type: string}
        energy_consumption_kwh_per_km: {type: number, minimum: 0}
        energy_price_per_kwh_minor: {type: integer, minimum: 0}
    Phase3ChargingStationRequest:
      type: object
      required: [region_code, name, total_ports, available_ports]
      properties:
        region_code: {type: string, enum: [IN-MH, IN-KA, AE-DU, SG-SG, GB-LND]}
        name: {type: string}
        location_label: {type: string}
        connector_types: {type: array, items: {type: string}}
        total_ports: {type: integer, minimum: 1}
        available_ports: {type: integer, minimum: 0}
        power_kw: {type: number, minimum: 0}
        energy_price_per_kwh_minor: {type: integer, minimum: 0}
        status: {type: string}
        operating_hours: {type: object}
    Phase3ChargingStationPatch:
      type: object
      properties:
        name: {type: string}
        location_label: {type: string}
        connector_types: {type: array, items: {type: string}}
        total_ports: {type: integer, minimum: 0}
        available_ports: {type: integer, minimum: 0}
        power_kw: {type: number, minimum: 0}
        energy_price_per_kwh_minor: {type: integer, minimum: 0}
        status: {type: string}
        operating_hours: {type: object}
    Phase3SustainabilityTargetRequest:
      type: object
      required: [period_start, period_end, baseline_kg, target_kg]
      properties:
        scope: {type: string}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        baseline_kg: {type: number, minimum: 0}
        target_kg: {type: number, minimum: 0}
    Phase3RegionRequest:
      type: object
      required: [region_code]
      properties:
        region_code: {type: string, enum: [IN-MH, IN-KA, AE-DU, SG-SG, GB-LND]}
        name: {type: string}
        currency: {type: string, minLength: 3, maxLength: 3}
        timezone: {type: string}
        locale: {type: string}
        tax_regime: {type: string}
        distance_unit: {type: string, enum: [km, mi]}
        status: {type: string, enum: [active, inactive]}
        is_default: {type: boolean}
        effective_from: {type: string, format: date}
        effective_to: {type: string, format: date}
        metadata: {type: object}
    Phase3FxRequest:
      type: object
      required: [base_currency, quote_currency, amount_minor]
      properties:
        base_currency: {type: string, minLength: 3, maxLength: 3}
        quote_currency: {type: string, minLength: 3, maxLength: 3}
        amount_minor: {type: integer, minimum: 0}
    Phase12MasterRequest:
      type: object
      required: [kind, code, name]
      properties:
        kind: {type: string}
        code: {type: string}
        name: {type: string}
        status: {type: string}
        effective_from: {type: string, format: date}
        effective_to: {type: string, format: date}
        metadata: {type: object}
    RosterRequest:
      type: object
      required: [route_plan_id, plan_date]
      properties:
        route_plan_id: {type: string}
        plan_date: {type: string, format: date}
        assignments: {type: array, items: {type: object}}
        constraints: {type: object}
    BulkOperationRequest:
      type: object
      required: [operation, entity_type, ids]
      properties:
        operation: {type: string}
        entity_type: {type: string}
        ids: {type: array, maxItems: 200, items: {type: string}}
        idempotency_key: {type: string}
        patch: {type: object}
        driver_id: {type: string}
        vehicle_id: {type: string}
    SavedViewRequest:
      type: object
      required: [scope, name]
      properties:
        scope: {type: string}
        name: {type: string}
        filters: {type: object}
        columns: {type: array, items: {type: string}}
        shared: {type: boolean}
    EvidenceRequest:
      type: object
      required: [evidence_type]
      properties:
        evidence_type: {type: string}
        filename: {type: string}
        source_event_id: {type: string}
        sha256: {type: string}
        metadata: {type: object}
    FormulaRequest:
      type: object
      required: [code, weights]
      properties:
        code: {type: string}
        weights: {type: object, additionalProperties: {type: number}}
        thresholds: {type: object}
    ReconciliationRequest:
      type: object
      required: [expected_paise, observed_paise]
      properties:
        expected_paise: {type: integer}
        observed_paise: {type: integer}
        scorecard_run_id: {type: string}
        statement_id: {type: string}
        evidence: {type: object}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}

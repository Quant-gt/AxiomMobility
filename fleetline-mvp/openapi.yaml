        tax_rate_bps: {type: integer, minimum: 0, maximum: 10000}
        origin_state: {type: string}
        destination_state: {type: string}
    SupplierBillRequest:
      type: object
      required: [bill_number, total_paise]
      properties:
        bill_number: {type: string}
        subtotal_paise: {type: integer, minimum: 0}
        tax_paise: {type: integer, minimum: 0}
        total_paise: {type: integer, minimum: 0}
        supplier_id: {type: string}
    CostRequest:
      type: object
      required: [category, amount_paise]
      properties:
        category: {type: string}
        amount_paise: {type: integer, minimum: 0}
        cost_type: {type: string}
        vehicle_id: {type: string}
        duty_id: {type: string}
    PaymentLinkRequest:
      type: object
      required: [amount_paise]
      properties:
        invoice_id: {type: string}
        amount_paise: {type: integer, minimum: 0}
        expires_days: {type: integer, minimum: 1, maximum: 30}
    FinancialActionRequest:
      type: object
      required: [action_type, entity_type, entity_id]
      properties:
        action_type: {type: string}
        entity_type: {type: string}
        entity_id: {type: string}
        payload: {type: object}
    NetworkEdgeRequest:
      type: object
      required: [partner_name]
      properties:
        partner_name: {type: string}
        cities: {type: array, items: {type: string}}
    IdempotentCommand:

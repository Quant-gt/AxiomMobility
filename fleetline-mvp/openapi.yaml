        vendor_name: {type: string}
        cities: {type: array, items: {type: string}}
        service_types: {type: array, items: {type: string}}
        vehicle_types: {type: array, items: {type: string}}
        capabilities: {type: array, items: {type: string}}
        capacity: {type: object}
        compliance: {type: object}
    NetworkQuoteRequest:
      type: object
      required: [vendor_profile_id, quote]
      properties:
        vendor_profile_id: {type: string}
        idempotency_key: {type: string}
        quote: {type: object, required: [total_paise]}
        assumptions: {type: object}
    NetworkComparisonRequest:
      type: object
      properties:
        quote_version_ids: {type: array, items: {type: string}}
        idempotency_key: {type: string}
    NetworkAwardRequest:
      type: object
      required: [comparison_id, quote_version_id]
      properties:
        comparison_id: {type: string}
        quote_version_id: {type: string}
        award_reason: {type: string}
        terms: {type: object}
        idempotency_key: {type: string}
    NetworkEvidenceRequest:
      type: object
      required: [evidence]
      properties:
        evidence: {type: object}
        metrics: {type: object}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        idempotency_key: {type: string}
    NetworkSettlementRequest:
      type: object
      required: [gross_paise, deductions_paise, evidence, period_start, period_end]
      properties:
        scorecard_id: {type: string}
        gross_paise: {type: integer, minimum: 0}
        deductions_paise: {type: integer, minimum: 0}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        evidence: {type: object}
        idempotency_key: {type: string}
    ExportRequest:
      type: object
      properties:
        report_type: {type: string}
        filters: {type: object}
    PrivacyRequest:
      type: object
      required: [request_type]
      properties:
        request_type: {type: string, enum: [access, correction, deletion, export, withdraw_consent]}
        notes: {type: string}
    P0MasterRequest:
      type: object
      required: [code, name]
      properties:
        code: {type: string, maxLength: 80}
        name: {type: string, maxLength: 160}
        status: {type: string}
        effective_from: {type: string, format: date}

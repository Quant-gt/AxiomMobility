            phone: {type: string}
            city: {type: string}
            organization_name: {type: string}
    OnboardingPatch:
      type: object
      required: [step]
      properties:
        step: {type: string}
        status: {type: string, enum: [pending, complete]}
        metadata: {type: object}
    BookingRequest:
      type: object
      required: [passenger_name, pickup, dropoff]
      properties:
        customer_id: {type: string}
        passenger_name: {type: string}
        passenger_phone: {type: string}
        pickup: {type: object}
        dropoff: {type: object}
        scheduled_at: {type: string, format: date-time}
        duty_type: {type: string}
    RecurringBookingRequest:
      type: object
      required: [cadence, start_at, occurrences, template]
      properties:
        cadence: {type: string, enum: [daily, weekly, monthly, business_days]}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        occurrences: {type: integer, minimum: 1, maximum: 365}
        template: {$ref: '#/components/schemas/BookingRequest'}
    Stop:
      type: object
      required: [label]
      properties:
        label: {type: string}
        address: {type: object}
        arrival_at: {type: string, format: date-time}
        departure_at: {type: string, format: date-time}
    DutyTransition:
      type: object
      required: [status]
      properties:
        status: {type: string}
        start_odometer: {type: integer, minimum: 0}
        end_odometer: {type: integer, minimum: 0}
        idempotency_key: {type: string}
    ProofRequest:
      type: object
      required: [proof_type]
      properties:
        proof_type: {type: string, enum: [otp, signature, photo, duty_slip, note]}
